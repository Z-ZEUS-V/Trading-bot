[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-trading-research"
version = "0.1.0"
description = "Evidence-led, low-cost strategy research assistant"
requires-python = ">=3.11"
dependencies = ["openai>=2.0.0"]

[project.scripts]
astra-research = "astra_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
